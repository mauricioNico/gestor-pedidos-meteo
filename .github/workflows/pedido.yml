name: Generar pedido meteorológico
run-name: Pedido ${{ inputs.pedido_id }}

on:
  workflow_dispatch:
    inputs:
      pedido_id: {description: Identificador del pedido, required: true, default: PED-MANUAL, type: string}
      modelo: {description: Modelo, required: true, default: GFS, type: choice, options: [GFS, ECMWF]}
      productos: {description: "Productos: SFC,500,200,SOND,MGRAM", required: true, default: SFC, type: string}
      nombre_region: {description: Nombre de la región, required: true, default: Sudamerica, type: string}
      norte: {description: Latitud norte, required: true, default: "15", type: string}
      sur: {description: Latitud sur, required: true, default: "-60", type: string}
      oeste: {description: Longitud oeste, required: true, default: "-90", type: string}
      este: {description: Longitud este, required: true, default: "-20", type: string}
      nombre_punto: {description: Nombre del punto, required: false, default: Rio_Cuarto, type: string}
      lat_punto: {description: Latitud del punto, required: false, default: "", type: string}
      lon_punto: {description: Longitud del punto, required: false, default: "", type: string}
      f_inicio: {description: Pronóstico inicial H+, required: true, default: "0", type: string}
      f_fin: {description: Pronóstico final H+, required: true, default: "24", type: string}
      salto: {description: Intervalo, required: true, default: "6", type: string}
      modo_corrida: {description: Corrida, required: true, default: AUTO, type: choice, options: [AUTO, MANUAL]}
      fecha: {description: Fecha YYYYMMDD, required: false, default: "", type: string}
      ciclo: {description: Ciclo 00/06/12/18, required: false, default: "", type: string}

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir motor meteorologico
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/bundle.part*.b64 | tr -d '\n\r' > /tmp/gestor_mvp_core.b64
          base64 -d /tmp/gestor_mvp_core.b64 > /tmp/gestor_mvp_core.tar.gz
          echo "c99741d8230f96038b2a267287cbffdbd9dd1517ac72167b41b8b0e46b89fc12  /tmp/gestor_mvp_core.tar.gz" | sha256sum -c -
          gzip -t /tmp/gestor_mvp_core.tar.gz
          tar -xzf /tmp/gestor_mvp_core.tar.gz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear solicitud
        shell: bash
        run: |
          python scripts/crear_solicitud_workflow.py --salida config/solicitud_workflow.json \
            --modelo "${{ inputs.modelo }}" --productos "${{ inputs.productos }}" \
            --nombre-region "${{ inputs.nombre_region }}" --norte "${{ inputs.norte }}" --sur "${{ inputs.sur }}" \
            --oeste "${{ inputs.oeste }}" --este "${{ inputs.este }}" --nombre-punto "${{ inputs.nombre_punto }}" \
            --lat-punto "${{ inputs.lat_punto }}" --lon-punto "${{ inputs.lon_punto }}" \
            --f-inicio "${{ inputs.f_inicio }}" --f-fin "${{ inputs.f_fin }}" --salto "${{ inputs.salto }}" \
            --modo-corrida "${{ inputs.modo_corrida }}" --fecha "${{ inputs.fecha }}" --ciclo "${{ inputs.ciclo }}"

      - name: Ejecutar motor
        run: python python/orquestador.py config/solicitud_workflow.json

      - name: Recuperar historial publicado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SITE=/tmp/site-state
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$URL" refs/heads/site-state >/dev/null 2>&1; then
            git clone --depth 1 --branch site-state "$URL" "$SITE"
          else
            mkdir -p "$SITE"
            cd "$SITE"
            git init
            git remote add origin "$URL"
          fi

      - name: Incorporar pedido y eliminar vencidos
        run: |
          python scripts/publicar_pedido.py \
            --pedido-id "${{ inputs.pedido_id }}" \
            --modelo "${{ inputs.modelo }}" \
            --region "${{ inputs.nombre_region }}" \
            --productos "${{ inputs.productos }}" \
            --salidas salidas \
            --site /tmp/site-state \
            --dias 7

      - name: Persistir historial de 7 dias
        shell: bash
        run: |
          set -e
          cd /tmp/site-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE=$(git write-tree)
          COMMIT=$(echo "Actualizar pedidos meteorologicos" | git commit-tree "$TREE")
          git push origin "$COMMIT:refs/heads/site-state" --force

      - name: Preparar GitHub Pages
        run: |
          rm -rf public-site
          mkdir public-site
          rsync -a --exclude=.git /tmp/site-state/ public-site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar productos
        id: deployment
        uses: actions/deploy-pages@v4
